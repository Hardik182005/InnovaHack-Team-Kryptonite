<!doctype html><meta charset="utf-8"><title>p</title>
<script>
fetch('/').then(r=>r.text()).then(()=>{});
addEventListener('DOMContentLoaded',()=>{
  const f=document.createElement('iframe');
  f.src='/'; f.style.cssText='width:1400px;height:600px;border:0';
  f.onload=()=>{setTimeout(()=>{
    const d=f.contentDocument, out=[];
    ['.shell','.header','main','.hero','.blobs'].forEach(sel=>{
      const el=d.querySelector(sel); if(!el) return;
      const r=el.getBoundingClientRect(), cs=f.contentWindow.getComputedStyle(el);
      out.push(sel+' top='+Math.round(r.top)+' mt='+cs.marginTop+' pt='+cs.paddingTop);
    });
    document.title='P::'+out.join(' | ');
  },2500)};
  document.body.appendChild(f);
});
</script>
